<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Time</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            color: #e0e0ff;
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(90deg, #00f0ff, #9b59b6, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Orbitron', monospace;
            animation: float 3s ease-in-out infinite;
        }
        .error-title {
            font-size: 2rem;
            margin: 2rem 0;
            color: #00f0ff;
        }
        .error-desc {
            color: #8888aa;
            margin-bottom: 3rem;
        }
        .btn-home {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: #00f0ff;
            color: #0a0a12;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            transition: all 0.3s;
        }
        .btn-home:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .stars {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 20% 30%, rgba(0, 240, 255, 0.1), transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(155, 89, 182, 0.1), transparent 50%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">⚡ YOU'VE BECOME LOST IN TIME ⚡</h1>
        <p class="error-desc">This page doesn't exist in this timeline dimension.</p>
        <a href="/" class="btn-home">← Return to Present</a>
    </div>
</body>
</html>
